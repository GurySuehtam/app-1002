`<script>` no final do seu arquivo por esse aqui. Design continua 100% igual:
<script>
    const entrada = document.getElementById("entrada");
    const mensagens = document.getElementById("mensagens");
    const digitando = document.getElementById("digitando");
    let nomeUsuario = "";

    function adicionarMensagem(texto, tipo) {
        const d = document.createElement("div");
        d.classList.add("mensagem", tipo);
        d.innerText = texto;
        mensagens.appendChild(d);
        mensagens.scrollTop = mensagens.scrollHeight;
    }

    function enviar() {
        const txt = entrada.value.trim();
        if (!txt) return;
        adicionarMensagem(txt, "usuario");
        entrada.value = "";
        digitando.style.display = "block";
        setTimeout(() => responder(txt), 500 + Math.random()*500);
    }

    function responder(original) {
        let t = original.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        let r = "";

        // SALVAR NOME
        if(t.includes("meu nome e")) {
            nomeUsuario = original.split("meu nome é")[1] || original.split("meu nome e")[1] || "";
            nomeUsuario = nomeUsuario.trim().split(" ")[0];
            r = `Prazer, ${nomeUsuario}! 😎 Já salvei seu nome aqui.`;
        }
        // CONTA MATEMÁTICA
        else if (/^[0-9+\-*/().\s]+$/.test(t) && /[+\-*/]/.test(t)) {
            try { let res = eval(t); r = `Deu ${res} 🧮 ${nomeUsuario? nomeUsuario+", quer outra conta?" : ""}`; }
            catch(e){ r = "Essa conta tá estranha, manda de novo?"; }
        }
        // XINGAMENTO
        else if (/(porra|caralho|vsf|fdp|puta|foda)/.test(t)) {
            r = "Opa, sem palavrão 😅 mantem leve, fui feito pelo Matheus pra ajudar a 1002.";
        }
        // SAUDAÇÃO
        else if (/(oi|ola|e ai|opa|salve|oii)/.test(t)) {
            r = nomeUsuario? `Fala ${nomeUsuario}! 👋 No que te ajudo hoje?` : "Fala! 😎 ÉTER online, manda a dúvida.";
        }
        // O QUE É / COMO FAZER
        else if (t.includes("o que e") || t.includes("o que significa") || t.includes("me explica")) {
            r = `Boa! Sobre "${original}" 🤔 - Em resumo: é um conceito importante. Se me falar a matéria (matemática, história, etc) eu te dou um resumo bem melhor e exemplos.`;
        }
        // MATÉRIAS - TODAS
        else if (t.includes("matematica")) r = "Matemática 📐 manda o assunto: equação, função, bhaskara, geometria?";
        else if (t.includes("portugues") || t.includes("redacao")) r = "Português 📚 é gramática, interpretação ou redação? Me fala o tema.";
        else if (t.includes("historia")) r = "História 🏛️ Brasil, Guerra, Revolução? Qual capítulo?";
        else if (t.includes("geografia")) r = "Geografia 🌍 clima, relevo, população, globalização?";
        else if (t.includes("fisica")) r = "Física ⚡ cinemática, força, energia? Manda.";
        else if (t.includes("quimica")) r = "Química 🧪 átomo, tabela, ligação? Qual parte tá difícil?";
        else if (t.includes("biologia")) r = "Biologia 🧬 célula, genética, corpo humano?";
        else if (t.includes("ingles")) r = "Inglês 🇺🇸 quer traduzir algo? Manda a frase.";
        else if (t.includes("filosofia") || t.includes("sociologia")) r = "Filosofia/Sociologia 🤯 manda o autor ou tema que eu resumo.";
        // ESCOLA
        else if (t.includes("prova") || t.includes("teste")) r = "Prova chegando? 😰 Me fala matéria e assunto que eu monto um resumo turbo pra você revisar.";
        else if (t.includes("1002")) r = "1002 é a braba 🔥 Melhor turma, por isso o ÉTER foi feito pra vocês.";
        else if (t.includes("matheus") || t.includes("representante")) r = "Matheus Pereira? O representante que me criou 🚀 o cara é brabo.";
        else if (t.includes("piada")) r = ["Por que o lápis foi preso? Porque ele era suspeito de fazer rabiscos 😂","O que o zero disse pro oito? Que cinto maneiro! 😂"][Math.floor(Math.random()*2)];
        else if (t.includes("te amo") || t.includes("gosta de mim")) r = "Awn 🥺 tamo junto! Tô aqui pra ajudar sempre.";
        else if (t.includes("tchau") || t.includes("flw") || t.includes("falou")) r = "Falou! 👋 Qualquer coisa só chamar.";
        else if (t.includes("obrigado") || t.includes("valeu")) r = "De nada! 😎 precisou é só chamar.";
        else if (t.includes("quem e voce") || t.includes("seu nome")) r = "Sou o ÉTER AI 🤖 assistente da 1002 criado pelo Matheus.";
        // QUALQUER OUTRA COISA - NUNCA DIZ "NÃO SEI"
        else {
            let respostasGerais = [
                `Sobre "${original}"? 🤔 Massa! Me explica um pouco mais o que você quer saber disso que eu já te ajudo com detalhes.`,
                `Entendi que é sobre "${original}" 👀 Se for de escola, me fala a matéria. Se for curiosidade, me fala o que exatamente quer saber.`,
                `Boa! "${original}" é interessante 🧠 Você quer um resumo, explicação, exemplo ou ajuda pra fazer algo com isso?`,
                `Anotado! 📝 Sobre "${original}", você quer que eu explique de forma simples, mais avançada ou com exemplo prático?`
            ];
            r = respostasGerais[Math.floor(Math.random()*respostasGerais.length)];
        }

        digitando.style.display = "none";
        adicionarMensagem(r, "bot");
    }

    entrada.addEventListener("keydown", e => { if(e.key === "Enter") enviar(); });
</script>
