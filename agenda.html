agenda.html: <!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda - 1002</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;background:#0e0e11;color:#fff}.mono{font-family:'JetBrains Mono',monospace}.glass{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08)}</style>
</head>
<body class="p-5 max-w-4xl mx-auto">
<a href="turma 1002.html" class="bg-white text-black px-4 py-2 rounded-full text-xs font-black">← TURMA 1002</a>
<h1 class="text-5xl font-black mt-6 tracking-tighter">AGENDA<span class="text-green-500">.</span></h1>
<p class="mono text-[11px] text-white/40 mt-2">PROVAS, EVENTOS, DATAS IMPORTANTES</p>

<div id="lista" class="space-y-3 mt-8"></div>

<script>
async function load(){
  let agenda = await fetch('/api/agenda').then(r=>r.json());
  agenda = agenda.sort((a,b)=> new Date(a.data_evento) - new Date(b.data_evento));

  document.getElementById('lista').innerHTML = agenda.map(ev=>{
    let pri = ev.prioridade==='Urgente'? 'border-red-500' : ev.prioridade==='Importante'? 'border-yellow-500' : 'border-zinc-700';
    return `
    <div class="glass rounded-[22px] p-5 flex gap-4 border-l-4 ${pri}">
      <div class="bg-white text-black rounded-xl w-16 h-16 flex flex-col items-center justify-center font-black leading-none">
        <span class="text-[10px]">${(ev.data_evento||'').substring(5,7)}/${(ev.data_evento||'').substring(0,4)}</span>
        <span class="text-2xl">${(ev.data_evento||'').substring(8,10)}</span>
      </div>
      <div class="flex-1">
        <div class="font-black text-lg leading-tight">${ev.titulo}</div>
        <div class="mono text-[11px] text-white/40 mt-1">⏰ ${ev.horario||'Dia todo'} • ${ev.prioridade}</div>
        <div class="text-sm text-white/60 mt-2">${ev.descricao||''}</div>
      </div>
    </div>`
  }).join('') || '<div class="glass p-6 rounded-2xl text-white/30">Nenhum evento na agenda ainda.</div>';
}
load();
</script>
</body>
</html>
