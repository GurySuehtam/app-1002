<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin - Turma 1002</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0f0f0f;color:#fff;padding:20px}
h1{text-align:center;color:#00ff88;margin-bottom:10px}
#status{background:#1a3a2a;color:#00ff88;padding:10px;text-align:center;border-radius:8px;margin-bottom:20px;border:1px solid #00ff88}
.card{background:#1e1e1e;padding:20px;border-radius:12px;margin-bottom:20px;border:1px solid #333}
.card h3{margin-bottom:15px;color:#00ff88}
input{padding:12px;border-radius:8px;border:1px solid #333;background:#2a2a2a;color:#fff;width:250px;margin-right:8px}
button{padding:12px 18px;border-radius:8px;border:none;background:#00ff88;color:#000;font-weight:bold;cursor:pointer}
button:hover{background:#00cc6a}
.item{display:flex;justify-content:space-between;align-items:center;background:#2a2a2a;padding:10px 15px;margin:6px 0;border-radius:8px}
.item button{background:#ff4444;color:#fff;padding:6px 12px}
</style>
</head>
<body>
<h1>TURMA 1002 - PAINEL ADMIN</h1>
<div id="status">✅ Conectado no banco de verdade - Nunca mais vai zerar</div>

<div class="card">
<h3>Adicionar Aluno na Turma 1002</h3>
<input id="nome" placeholder="Nome do aluno">
<input id="turma" value="1002" style="width:100px">
<button onclick="addAluno()">Adicionar</button>
</div>

<div class="card">
<h3>Adicionar em Recuperação</h3>
<input id="nomeRec" placeholder="Nome do aluno">
<button onclick="addRec()">Adicionar Rec</button>
</div>

<div class="card">
<h3>Alunos - 1002 (<span id="qtdAlunos">0</span>)</h3>
<div id="listaAlunos">Carregando...</div>
</div>

<div class="card">
<h3>Recuperação (<span id="qtdRec">0</span>)</h3>
<div id="listaRec">Carregando...</div>
</div>

<script>
const SUPABASE_URL = "https://hoaxcirdtpsgtvdnkctm.supabase.co";
const SUPABASE_KEY = "sb_publishable_F9wM9pKE5gJ7CeDXi6mkFQ_GPqk6lgJ";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function carregar(){
  const {data:alunos} = await client.from('alunos').select('*').order('id',{ascending:true});
  document.getElementById('listaAlunos').innerHTML = (alunos||[]).map(a=>`<div class="item"><span>${a.nome} - ${a.turma}</span><button onclick="delAluno(${a.id})">Excluir</button></div>`).join('') || 'Nenhum aluno ainda';
  document.getElementById('qtdAlunos').innerText = alunos ? alunos.length : 0;

  const {data:rec} = await client.from('recuperacao').select('*').order('id',{ascending:true});
  document.getElementById('listaRec').innerHTML = (rec||[]).map(r=>`<div class="item"><span>${r.nome}</span><button onclick="delRec(${r.id})">Excluir</button></div>`).join('') || 'Nenhum';
  document.getElementById('qtdRec').innerText = rec ? rec.length : 0;
}
async function addAluno(){
  const nome = document.getElementById('nome').value.trim();
  const turma = document.getElementById('turma').value.trim() || '1002';
  if(!nome) return alert('Digite o nome');
  await client.from('alunos').insert({nome, turma});
  document.getElementById('nome').value=''; carregar();
}
async function addRec(){
  const nome = document.getElementById('nomeRec').value.trim();
  if(!nome) return alert('Digite o nome');
  await client.from('recuperacao').insert({nome});
  document.getElementById('nomeRec').value=''; carregar();
}
async function delAluno(id){ if(confirm('Excluir?')){ await client.from('alunos').delete().eq('id',id); carregar(); } }
async function delRec(id){ if(confirm('Excluir?')){ await client.from('recuperacao').delete().eq('id',id); carregar(); } }
carregar();
</script>
</body>
</html>
