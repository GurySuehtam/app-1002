<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Painel Admin - 1002</title></head>
<body>
<h1>Publicar Aviso - 1002</h1>

<input id="titulo" placeholder="Título do aviso" style="width:90%;padding:10px"><br><br>
<textarea id="descricao" placeholder="Descrição" style="width:90%;height:100px;padding:10px"></textarea><br><br>
<input id="materia" placeholder="Matéria" style="width:90%;padding:10px"><br><br>
<button onclick="enviar()" style="padding:15px 30px;background:blue;color:white">PUBLICAR AVISO</button>

<p id="status"></p>

<h2>Avisos atuais:</h2>
<div id="lista"></div>

<script>
const API = '/api/avisos';

async function carregar(){
  const r = await fetch(API);
  const dados = await r.json();
  document.getElementById('lista').innerHTML = dados.map(a=>`
    <div style="border:1px solid #ccc;padding:10px;margin:5px">
      <b>${a.titulo}</b> - ${a.materia} 
      <button onclick="apagar('${a.id}')">Apagar</button>
    </div>
  `).join('');
}

async function enviar(){
  const titulo = document.getElementById('titulo').value;
  const descricao = document.getElementById('descricao').value;
  const materia = document.getElementById('materia').value;
  if(!titulo) return alert('Digite o título');
  
  document.getElementById('status').innerText = 'Enviando...';
  await fetch(API, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({titulo, descricao, materia})
  });
  document.getElementById('status').innerText = 'Publicado com sucesso!';
  document.getElementById('titulo').value='';
  document.getElementById('descricao').value='';
  carregar();
}

async function apagar(id){
  if(!confirm('Apagar?')) return;
  await fetch(API+'/'+id, {method:'DELETE'});
  carregar();
}

carregar();
</script>
</body>
</html>
