<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Painel 1002</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-white p-6">
<h1 class="text-3xl font-black">Painel 1002 - Criar Aviso</h1>
<div class="mt-6 max-w-lg space-y-3">
<input id="titulo" placeholder="Título" class="w-full p-3 rounded-xl bg-zinc-800">
<textarea id="descricao" placeholder="Descrição" class="w-full p-3 rounded-xl bg-zinc-800"></textarea>
<input id="materia" placeholder="Matéria (ex: Geral)" class="w-full p-3 rounded-xl bg-zinc-800">
<select id="prioridade" class="w-full p-3 rounded-xl bg-zinc-800"><option>Normal</option><option>Importante</option><option>Urgente</option></select>
<label><input type="checkbox" id="destaque"> Destaque</label><br>
<button onclick="enviar()" class="w-full bg-[#5865F2] p-4 rounded-xl font-bold">PUBLICAR</button>
<p id="status"></p>
</div>
<div id="lista" class="mt-8"></div>
<script>
const API='/api/avisos';
async function carregar(){const r=await fetch(API);const d=await r.json();document.getElementById('lista').innerHTML=d.map(a=>`<div class="bg-zinc-900 p-3 m-2 rounded-xl flex justify-between"><span>${a.titulo} - ${a.prioridade}</span><button onclick="apagar('${a.id}')" class="text-red-400">Apagar</button></div>`).join('')}
async function enviar(){const body={titulo:titulo.value,descricao:descricao.value,materia:materia.value||'GERAL',prioridade:prioridade.value,destaque:destaque.checked,novo:true,data_evento:new Date().toLocaleDateString()};status.innerText='Enviando...';await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});status.innerText='Publicado!';carregar()}
async function apagar(id){await fetch(API+'/'+id,{method:'DELETE'});carregar()}
carregar();
</script></body></html>
